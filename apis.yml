- aid: reapit:reapit-connect
  name: Reapit Connect
  description: >-
    Reapit's hosted OpenID Connect identity service, which fronts every other
    Foundations API. It supports the authorization code flow for user-context
    applications and the client credentials flow for server-to-server
    integrations, issuing bearer access tokens with a one-hour lifetime.
    Application scopes are selected at app registration in the developer portal
    and are granted per customer at install time. The OIDC discovery document is
    served anonymously at https://connect.reapit.cloud/.well-known/openid-configuration
    (HTTP 200) and shows an Auth0-backed tenant with PKCE (S256), device
    authorization, back-channel authentication, JWKS, dynamic client registration
    and token revocation endpoints.
  humanURL: https://foundations-documentation.reapit.cloud/api/reapit-connect
  baseURL: https://connect.reapit.cloud
  tags:
  - Authentication
  - OpenID Connect
  - Identity
