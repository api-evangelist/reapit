apis:
- aid: reapit:reapit-foundations-platform-rest-api
  name: Reapit Foundations Platform REST API
  description: >-
    The core Foundations REST API over the Reapit agency CRM data platform. It is
    documented as a hypermedia REST API with date-based versioning (the
    `api-version: 2020-01-31` header is required), optimistic concurrency via
    ETag/If-Match, embedded and linked resources, pre-signed URL file upload, and
    a metadata service for custom entities and custom fields. Resource domains
    named in the platform permissions glossary include applicants, areas,
    appointments, certificates, companies, contacts, conveyancing, documents,
    enquiries, identity checks, invoices, journal entries, keys, landlords,
    negotiators, offers, offices, properties, property alarm data, referrals,
    sources, tasks, telephony notifications, tenancies, transactions, vendors and
    works orders. Published rate limits are 20 requests per second, 5 concurrent
    requests per customer and 250,000 requests per day. The Interactive API
    Explorer at developers.reapit.cloud/swagger renders a Swagger document, but
    that document is served from platform.reapit.cloud/docs and requires a bearer
    token — it returned HTTP 200 with "Could not load Swagger documentation" to an
    anonymous client, so no spec was harvestable.
  humanURL: https://foundations-documentation.reapit.cloud/api/api-documentation
  baseURL: https://platform.reapit.cloud
