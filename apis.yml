- aid: reapit:reapit-foundations-mcp-server
  name: Reapit Foundations MCP Server (Alpha)
  description: >-
    An alpha Model Context Protocol server exposing the Foundations platform to AI
    agents over Streamable HTTP at a single endpoint. Authentication is a Reapit
    Connect JWT that must carry the `agencyCloud/mcp.access` scope (a token
    without it is rejected with 403), plus a `reapit-customer` tenant header for
    machine-to-machine clients. Registered tool domains are appointments (the
    richest, including open-house attendee management), properties (search,
    appraisals, key movements, driving directions), configuration lookups,
    contacts, applicants, companies, offices, negotiators, areas, offers,
    landlords, vendors and tenancies. Related entities are embedded automatically.
    Early access is by form submission; the endpoint returned HTTP 401 to an
    anonymous probe.
  humanURL: https://foundations-documentation.reapit.cloud/api/mcp-alpha
  baseURL: https://foundations-mcp.iaas.reapit.cloud/mcp
