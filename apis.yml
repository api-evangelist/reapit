- aid: reapit:reapit-foundations-notifications-api
  name: Reapit Foundations Notifications API
  description: >-
    An inbound API that lets a third-party application push real-time event
    notifications into Reapit products for display to named CRM users. Requests
    POST to /notifications using an envelope-and-payload contract, where the
    envelope carries the notification type and a `targets` object listing one or
    more `negotiatorId` values; multiple targets trigger a fan-out. Callers need
    the `negotiators.read` scope and GET /negotiators to map their own users back
    to Reapit negotiators. Sandbox testing requires an active Developer Edition
    subscription and a dedicated negotiator ID, and display inside a live customer
    CRM must be enabled by Reapit support at the customer's request.
  humanURL: https://foundations-documentation.reapit.cloud/api/notifications
  baseURL: https://platform.reapit.cloud
  tags:
  - Notification
  - Event
  - Real-Estate
  - United Kingdom
  tags_raw:
