aid: reapit
url: https://raw.githubusercontent.com/api-evangelist/reapit/refs/heads/main/apis.yml
name: Reapit
kind: company
description: >-
  Reapit is a United Kingdom-headquartered supplier of agency CRM and property
  management software for estate and letting agents, best known for AgencyCloud
  and Property Cloud, and operating across the UK and Ireland, Australia and New
  Zealand, and Denmark (through Mindworking). In a market with no MLS, Reapit
  sits in the middle of the value chain: listings are created and maintained in
  the agent's CRM and pushed outward to the two dominant consumer portals,
  Rightmove and Zoopla, so the CRM — not any cooperative database — is where the
  machine-readable property record actually lives. Its API posture is unusually
  open for this sector and is the counter-example to "certified but unreachable":
  Reapit Foundations is a genuine developer platform with a public documentation
  site at foundations-documentation.reapit.cloud, a self-serve registration form
  at developers.reapit.cloud/register behind published Developer Terms and
  Conditions, an immediately usable SBOX sandbox, OpenID Connect authentication
  through Reapit Connect with a live anonymous discovery document, a REST API
  covering roughly thirty CRM resource domains, a public GraphQL proxy, a real
  webhooks system with sixty-plus event topics, and an alpha Model Context
  Protocol server. The contract is split rather than absent: the Swagger/OpenAPI
  document that powers the Interactive API Explorer is served from
  platform.reapit.cloud/docs behind a bearer token, so no REST spec is
  harvestable anonymously — but full GraphQL introspection against
  graphql.reapit.cloud succeeds without credentials and yields a real
  machine-readable contract of 190 types, 63 queries and 58 mutations, which is
  the widest public description of the platform that exists. The MCP server's
  tools/list is auth-gated, so its 43 tools are known only from the docs.
  Reaching any real agency's data still requires the app to pass Reapit's
  AppMarket listing review and then be installed by that customer, who grants
  the scopes. There is no RESO Web API or
  Data Dictionary certification, no OData $metadata document and no Universal
  Property Identifier anywhere in Reapit's stack — RESO is a North American,
  NAR-driven construct and the UK has no MLS to certify against. Reapit publishes
  no open data; the open UK property layer belongs to HM Land Registry and
  Ordnance Survey, not to the CRM vendors.
accessModel:
