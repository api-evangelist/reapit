- aid: reapit:reapit-foundations-webhooks
  name: Reapit Foundations Webhooks
  description: >-
    Real-time outbound event delivery from the Reapit CRM to an endpoint you host.
    Webhooks are created either in the developer portal UI at
    developers.reapit.cloud/webhooks/new or programmatically through the REST API,
    are subscribed per customer (including the SBOX sandbox), and support event
    filters and optional inclusion of semi-structured payload data. Published
    topics span applicants, appointments, companies, contacts, conveyancing,
    documents, enquiries, identity checks, landlords, offers, offices, properties,
    property images, referrals, tenancies and vendors, with created / modified /
    read variants plus lifecycle events such as offers.accepted, offers.rejected,
    offers.withdrawn, appointments.cancelled, appointments.confirmed,
    properties.selling, contacts.optedout, and application.install /
    application.uninstall for AppMarket installation notifications. Delivery uses
    exponential backoff on failure, payloads are signed (signing key retrievable
    from platform.reapit.cloud/webhooks/signing/{id}), and source IP addresses are
    published for allowlisting.
  humanURL: https://foundations-documentation.reapit.cloud/api/webhooks
  baseURL: https://platform.reapit.cloud
  tags:
  - Webhook
  - Event
  - Real-Estate
  - United Kingdom
  tags_raw:
  - Webhooks
