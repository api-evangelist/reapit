    url: https://foundations-documentation.reapit.cloud/api/notifications
  - type: Authentication
    url: https://foundations-documentation.reapit.cloud/api/reapit-connect
- aid: reapit:reapit-agencycloud-desktop-api
  name: Reapit AgencyCloud Desktop API
  description: >-
    A custom URI-scheme API, not an HTTP API, used by AppMarket web applications
    hosted inside the AgencyCloud desktop CRM to drive the desktop from the
    embedded app. Links prefixed `agencycloud:` are structured REST-style against
    AgencyCloud's primary and secondary screens — property (load, matching,
    journal, offers, search), applicants (load, matching, journal, search),
    appointments (load diary), contacts (search, load, journal), works orders
    (load, search) and related screens. Testing requires AgencyCloud Developer
    Edition, obtained from the Desktop page of the developer portal; Reapit does
    not provide technical support for Developer Edition, and it is documented as
    beta with known gaps such as desktop-added images and documents not appearing
    on the platform.
  humanURL: https://foundations-documentation.reapit.cloud/api/desktop-api
  baseURL: agencycloud://
