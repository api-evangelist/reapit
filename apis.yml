- aid: reapit:reapit-foundations-graphql-api
  name: Reapit Foundations GraphQL API
  description: >-
    A GraphQL proxy over the Foundations Platform REST API, released publicly out
    of internal beta and used in production by Reapit's own Geo Diary AppMarket
    app. The stated objective is a schema identical to the REST platform with no
    extension or deviation. Visiting the endpoint in a browser loads a GraphQL
    Playground. Authentication is unusual and restrictive: it requires BOTH an
    `authorization` header carrying the Reapit Connect idToken and a
    `reapit-connect-token` header carrying the accessToken, which means only the
    authorization code flow works — client credentials machine-to-machine clients
    cannot use it. Metadata and Metadata Schema are absent from the schema because
    arbitrary JSON cannot be strongly typed. No additional charge over the REST
    API; consumption is billed on the downstream REST calls the proxy makes.
  humanURL: https://foundations-documentation.reapit.cloud/api/graphql
  baseURL: https://graphql.reapit.cloud/graphql
  tags:
  - GraphQL
  - Real-Estate
  - United Kingdom
