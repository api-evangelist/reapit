observations:
- One API version in nearly six years — every change captured here is additive.
- Tenancies and works orders are the two areas under most active development
  through 2026, consistent with lettings/property-management being where UK
  agency software is currently competing.
- Making Tax Digital plumbing (landlordDetails, contacts.landlorddetails.updated)
  appears across both the changelog and the webhook catalog.
