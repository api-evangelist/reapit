    authorize and revocation endpoints in the discovery document.
- id: oidc-core
  conforms: true
  evidence: >-
    Reapit Connect is an OpenID Connect provider; id_token signing algs RS256/
    PS256/HS256, userinfo endpoint, claims_supported published.
