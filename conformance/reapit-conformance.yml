method: searched
source: >-
  https://foundations-documentation.reapit.cloud/api/api-documentation ,
  https://connect.reapit.cloud/.well-known/openid-configuration ,
  https://www.reapit.com/security , and the introspected GraphQL schema at
  graphql/reapit-foundations.graphql
description: >-
  Which cross-cutting and industry standards the Reapit Foundations platform
  actually conforms to. Two findings matter. First, Reapit's protocol hygiene is
  strong for a vertical CRM: real OpenID Connect discovery, real RFC 8414
  metadata, real RFC 7232 conditional requests, real HAL hypermedia, real
  JSON Schema in two places (metadata validation and webhook event filters), and
  Ed25519 webhook signing. Second, and just as important as a negative: there is
  NO RESO Web API, no RESO Data Dictionary, no OData $metadata and no Universal
  Property Identifier anywhere in Reapit's stack. RESO is a North American,
  NAR-driven construct and the UK has no MLS to certify against — so the absence
  is structural to the market, not a Reapit shortcoming.
standards:
