source: >-
  graphql/reapit-foundations.graphql — derived from live anonymous introspection
  of https://graphql.reapit.cloud/graphql on 2026-07-26 (190 types, 55 *Model
  entity types), cross-read against
  https://foundations-documentation.reapit.cloud/platform-glossary
description: >-
  The entity-relationship graph of the Reapit Foundations CRM, derived from the
  GraphQL schema rather than an OpenAPI (the REST Swagger is bearer-gated). Two
  structural facts shape everything. First, Contact is the spine: applicant,
  vendor, landlord and tenant are ROLES a contact plays, wired through explicit
  relationship join entities (ApplicantContactRelationshipModel,
  LandlordRelationshipModel, VendorRelationshipModel, TenancyRelationships) that
  can point at either a contact or a company via a polymorphic
  associatedType/associatedId pair. Second, Property is the hub the transaction
  hangs off: the sales lifecycle runs Property -> Offer -> Conveyancing (with
  upward/downward chain links, the closest thing UK agency software has to an
  MLS transaction record), and the lettings lifecycle runs Property -> Tenancy
  -> TenancyCheck / RentReview / WorksOrder. Reapit's ids are per-customer, not
  global — OXF18000001 is only meaningful inside one agency's database.
identifiers:
  global_uniqueness: false
  composite_key: customerId + resource id
  format: >-
    Human-readable office-prefixed strings, e.g. contact OXF18000001, property
    OXF190347, office OXF, negotiator JAS/NEG — the office code prefix is
    conventional, not guaranteed.
  concurrency_token: _eTag on every singular resource (see conventions/)
common_fields:
  id: resource identifier (unique per customer database)
  created: ISO 8601 UTC creation timestamp
  modified: ISO 8601 UTC last-modified timestamp
  metadata: arbitrary JSON document attached by the calling app
  _eTag: optimistic-concurrency token
  _links: HAL link relations to related resources
  _embedded: related resources pulled in via the embed parameter
entities:
- name: Contact
  graphql_type: ContactModel
  fields: 30
  glossary: >-
    Primary person record with associated roles such as Applicant, Vendor,
    Tenancy or Landlord. Carries personal details and marketing/communication
    preferences.
  key_fields: [title, forename, surname, dateOfBirth, homePhone, mobilePhone, email,
    marketingConsent, officeIds, negotiatorIds, primaryAddress, secondaryAddress, workAddress]
  embeds: [documents, identityChecks, negotiators, offices, source]
- name: Company
  graphql_type: CompanyModel
  fields: 18
  glossary: >-
    Business organisation the agent deals with — solicitor, supplier, etc. Typed
    by role and able to participate in transactions.
  key_fields: [name, typeIds, supplierTypeId, address, accreditations]
  embeds: [companyTypes]
- name: Applicant
  graphql_type: ApplicantModel
  fields: 39
  glossary: Prospective buyer or renter with requirements, sources and notes.
  key_fields: [departmentId, solicitorId, officeIds, negotiatorIds, buying, renting,
    internalArea, externalArea, source, related]
  embeds: [appointments, areas, department, documents, negotiators, offers, offices,
    solicitor, source]
- name: Property
  graphql_type: PropertyModel
  fields: 48
  glossary: >-
    The richest entity in the schema — descriptions, notes, marketing, utilities,
    keys, certificates, developments and images (EPC, floorplans, maps).
  key_fields: [alternateId, areaId, departmentId, negotiatorId, officeIds, address,
    selling, letting, epc, internalArea, externalArea, rooms, keys]
  embeds: [appointments, area, department, documents, landlord, negotiator, offers,
    offices, images, tenancies, vendor]
- name: Offer
  graphql_type: OfferModel
  fields: 18
  glossary: A monetary amount proposed by an applicant on a sales property.
  key_fields: [applicantId, propertyId, amount, date, status, inclusions, exclusions,
    conditions]
  embeds: [applicant, conveyancing, negotiator, property]
- name: Conveyancing
  graphql_type: ConveyancingModel
  fields: 47
  glossary: >-
    Sales progression — turning an accepted offer into a completed sale, with
    chain management as a sub-resource.
  key_fields: [propertyId, vendorId, vendorSolicitorId, buyerId, buyerSolicitorId,
    externalAgentId, upwardChainId, downwardChainId, mortgageLenderId, mortgageBrokerId,
    mortgageSurveyorId, additionalSurveyorId]
  embeds: [buyerSolicitor, offer, property, vendor, vendorSolicitor]
  note: the UK chain, modelled explicitly as upward/downward links between conveyancing
    records
- name: Tenancy
  graphql_type: TenancyModel
  fields: 30
  glossary: A lettings agreement between a landlord and one or more tenants on a property.
