lifecycles:
- name: Sales
  chain: Enquiry -> Applicant -> Appointment (viewing/valuation) -> Offer -> Conveyancing
      -> completion
  status_events: [properties.selling.instructed, properties.selling.askingpricechanged,
    properties.selling.underoffer, properties.selling.exchanged, properties.selling.completed,
    properties.selling.withdrawn, properties.selling.lostinstruction]
- name: Lettings
  chain: Enquiry -> Applicant -> Appointment -> Tenancy -> TenancyCheck / RentReview
      / WorksOrder
  status_events: [tenancies.created, tenancies.modified, worksorders.raised, worksorders.complete,
    worksorders.cancelled]
- name: Compliance
  chain: Contact -> IdentityCheck (AML/KYC) -> Document
  status_events: [identitychecks.created, identitychecks.modified, contacts.optedout]
