sla:
  public_uptime_target: null
  service_catalogue: https://www.reapit.com/legal/terms-and-conditions/reapit-partner-business-service-catalogue
  note: >-
    Reapit publishes a Partner Business Services Catalogue (BSC) carrying
    response and resolution times by impact level rather than a public uptime
    percentage. P1/P2 issues are logged through the Reapit Service Desk Portal
    (https://reapitsupport.refined.site/) selecting product type "Reapit API";
    Reapit downgrades incorrectly-classified P1/P2 tickets and applies penalties
    under Schedule 4 of the Developer Portal Terms & Conditions. P3/P4 issues and
    all feature requests go to partners@reapit.com.
