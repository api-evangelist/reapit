generated: '2026-07-26'
method: searched
status: published
maturity: alpha
source: https://foundations-documentation.reapit.cloud/api/mcp-alpha
description: >-
  The Reapit Foundations MCP server is a real, hosted, first-party Model Context
  Protocol server that exposes the agency CRM platform to agents over a single
  Streamable HTTP endpoint. It is in alpha and behind an early-access form, and
  an anonymous tools/list POST returns 401 {"error":"No authorization header
  provided"} — so the tool names and domains below are the ones Reapit itself
  publishes in the documentation, not a live introspection. Input schemas are
  NOT published and require an authenticated tools/list call; see
  reapit-tool-crosswalk.yml for how each tool binds to a real GraphQL operation
  whose arguments are introspectable anonymously.
server:
  name: foundations
  transport: streamable-http
  url: https://foundations-mcp.iaas.reapit.cloud/mcp
  docs: https://foundations-documentation.reapit.cloud/api/mcp-alpha
  early_access: form
  early_access_note: >-
    Registration is by HubSpot form linked from the MCP alpha documentation page.
authentication:
  scheme: bearer
  issuer: https://connect.reapit.cloud/
  token: Reapit Connect JWT (access token)
  required_scope: agencyCloud/mcp.access
  required_scope_note: A token without this scope is rejected with 403.
  tenant_header:
    name: reapit-customer
    required_for: machine-to-machine (client-credentials) clients only
    note: >-
      User-context tokens carry the customer code themselves, so the header is
      not needed. Sandbox tenant id is SBOX.
  optional_headers:
  - name: x-timezone
    default: UTC
    example: Europe/London
    note: converts date-times in the formatted text stream output
live_probe:
  method: 'POST tools/list (jsonrpc 2.0), Accept: application/json, text/event-stream'
  status: 401
  body: '{"error":"No authorization header provided"}'
  probed: '2026-07-26'
  well_known:
  - path: /.well-known/oauth-protected-resource
    status: 401
  - path: /.well-known/oauth-authorization-server
    status: 401
  note: >-
    Unusually, even the RFC 9728 protected-resource metadata is auth-gated, so
    an MCP client cannot discover the authorization server anonymously — it must
    be told to use Reapit Connect out of band.
errors:
- status: 400
  meaning: Bad request — e.g. a client-credentials token without the reapit-customer header.
- status: 401
  meaning: Unauthorized — missing, expired, or invalid token.
- status: 403
  meaning: Forbidden — valid token, but lacking the agencyCloud/mcp.access scope.
- status: 502
  meaning: Upstream verification failure (identity provider unreachable).
behaviour:
  embedded_resources: >-
    The server applies Foundations "embeds" automatically — an appointment comes
    back with its negotiators, office and property attached rather than just
    their ids. Reapit documents this as convenient but subject to change, so
    agents must not assume a fixed set of embedded fields.
  stability: >-
    Reapit states parameters, tools, resources, prompts and responses are likely
    to change, and that List Tools is the authoritative current set per tenant.
client_config:
  mcpServers:
    foundations:
      type: streamable-http
      url: https://foundations-mcp.iaas.reapit.cloud/mcp
      headers:
        Authorization: Bearer <your-jwt>
        reapit-customer: <your-tenant-id>
tool_count: 43
