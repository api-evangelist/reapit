divergence_summary: >-
  Three surfaces, none a superset. GraphQL is the widest machine-readable
  surface Reapit exposes publicly (121 operations) but excludes metadata,
  webhooks and notifications by design and cannot be used by machine-to-machine
  clients. MCP is the narrowest (43 tools, read-mostly) but is the only surface
  with appraisals, open-house attendees and driving directions. REST is the
  superset in principle and the only surface with metadata, webhooks,
  notifications and pre-signed uploads — and the only one with no public
  machine-readable contract.
