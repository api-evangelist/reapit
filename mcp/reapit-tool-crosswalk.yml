source: >-
  mcp/reapit-mcp.yml (tool names published at
  https://foundations-documentation.reapit.cloud/api/mcp-alpha) bound to
  graphql/reapit-foundations.graphql (live anonymous introspection of
  https://graphql.reapit.cloud/graphql on 2026-07-26)
description: >-
  Reapit is the unusual case where the MCP surface is auth-gated but the GraphQL
  surface is not. An anonymous tools/list against the Foundations MCP server
  returns 401, yet full GraphQL introspection against graphql.reapit.cloud
  succeeds and returns 190 types, 63 query fields and 58 mutation fields. That
  makes GraphQL — not REST — the anchor for this crosswalk: each published MCP
  tool is bound to the GraphQL operation that carries its REAL argument
  contract, which an agent can introspect today. The REST platform is the
  ultimate backing store for all three surfaces (Reapit describes GraphQL as a
  proxy over the REST platform "with no extension or deviation"), but its
  Swagger document at platform.reapit.cloud/docs requires a bearer token, so no
  operationIds could be harvested and none are invented here.
surfaces:
  rest:
    base_url: https://platform.reapit.cloud
    spec: null
    spec_status: >-
      gated — platform.reapit.cloud/docs returns 200 with {"errorMessage":"Could
      not load Swagger documentation"} anonymously; /openapi.json, /swagger.json,
      /api-docs, /redoc and the host root all return 401. No operationIds
      available.
    docs: https://foundations-documentation.reapit.cloud/api/api-documentation
  graphql:
    endpoint: https://graphql.reapit.cloud/graphql
    introspection: open
    sdl: graphql/reapit-foundations.graphql
    queries: 63
    mutations: 58
    types: 190
    note: >-
      Introspection is anonymous, but EXECUTING an operation requires both an
      `authorization` header carrying the Reapit Connect idToken and a
      `reapit-connect-token` header carrying the accessToken — which means only
      the authorization-code flow works; client-credentials clients cannot use
      GraphQL. Metadata and Metadata Schema are deliberately absent from the
      schema because arbitrary JSON cannot be strongly typed.
    docs: https://foundations-documentation.reapit.cloud/api/graphql
  mcp:
    url: https://foundations-mcp.iaas.reapit.cloud/mcp
    transport: streamable-http
    tools_list: gated
    tools_list_status: 401 {"error":"No authorization header provided"}
    tools_published_in_docs: 43
    manifest: mcp/reapit-mcp.yml
    docs: https://foundations-documentation.reapit.cloud/api/mcp-alpha
