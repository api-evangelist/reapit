gaps:
- No server-side SDK in Python, Java, C#, PHP, Ruby, Go or Rust — integrators
  outside the JS/TS ecosystem hand-roll HTTP against the REST platform.
- No generated GraphQL client, despite the public GraphQL proxy at
  graphql.reapit.cloud/graphql being introspectable.
