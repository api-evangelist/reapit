method: searched
source: >-
  npm registry search for the @reapit and @reapit-cdk scopes, cross-checked
  against the Open Source Packages section of
  https://foundations-documentation.reapit.cloud/app-development
description: >-
  Reapit publishes its Foundations client libraries exclusively to npm under the
  @reapit scope — there is no PyPI, Maven Central, NuGet, RubyGems, Packagist,
  crates.io or Go module distribution, which follows from Foundations being a
  React/TypeScript app platform rather than a general-purpose server SDK
  ecosystem. The packages split into four families: auth helpers
  (connect-session, connect-session-server, login-with-reapit), generated API
  types (foundations-ts-definitions), UI component libraries (elements,
  elemental), and the IaaS tooling (cli, templates). A separate @reapit-cdk
  scope publishes AWS CDK constructs used to run apps on Reapit's IaaS platform;
  those are infrastructure constructs, not API clients.
