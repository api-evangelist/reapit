webhooksEventsSdksPostman:
  webhooks: |
    Yes, and they are the most complete webhook system found in this sector's UK
    leg. More than sixty topics across applicants, appointments, companies,
    contacts, conveyancing, documents, enquiries, identity checks, landlords,
    offers, offices, properties, property images, referrals, tenancies and
    vendors, with created / modified / read variants plus real lifecycle events
    (offers.accepted, offers.rejected, offers.withdrawn, appointments.cancelled,
    appointments.confirmed, properties.selling, contacts.optedout,
    enquiries.accepted, enquiries.rejected, contacts.landlorddetails) and
    platform events (application.install, application.uninstall). Subscriptions
    are per customer and support event filters and optional semi-structured
    payload data. Payloads describe the data change, not just the fact of it, so
    a consumer often needs no follow-up call. Delivery retries with exponential
    backoff, payloads are signed via a signing key at
    platform.reapit.cloud/webhooks/signing/{id}, source IPs are published for
    allowlisting, and webhooks can be created programmatically as well as in the
    portal UI. Sandbox testing against SBOX events is supported.
  events: |
    Beyond webhooks there is an inbound Notifications API (POST /notifications
    with an envelope/payload contract and negotiatorId fan-out targets). No
    AsyncAPI document, no event bus, no WebSocket surface, no streaming.
  mcp: |
    Yes — an alpha Model Context Protocol server over Streamable HTTP at
    https://foundations-mcp.iaas.reapit.cloud/mcp, gated on the
    `agencyCloud/mcp.access` scope, with ~40 named tools across thirteen domains.
    Registration for early access is via a HubSpot form linked from the docs.
    This is the only MCP server encountered in the UK real-estate leg of this
    study.
  sdks: |
    Real, first-party, and published to npm: @reapit/foundations-ts-definitions
    (TypeScript types regenerated daily from the Swagger contracts, including
    webhook payload types keyed by topic id), @reapit/connect-session and
    @reapit/connect-session-server (OAuth helpers), @reapit/elements (React
    component library), plus a Vite template, a Create React App template, and an
    IaaS CLI in beta. Code examples live at github.com/reapit/foundations-code-examples.
  postman: No official Postman collection or workspace found.
  changelog: Yes — https://foundations-documentation.reapit.cloud/whats-new
  statusPage: Yes — https://status.reapit.com/ (HTTP 200).
  rateLimits: |
    Published: 20 requests per second, 5 concurrent requests per customer,
    250,000 requests per day.
  sandbox: |
    Yes and it is real. SBOX provides demonstration data supporting all read AND
    write requests, reachable either by authorization code flow with developer
    portal credentials or by client credentials flow with `SBOX` as the
    `reapit-customer` header. The Interactive API Explorer is wired to it
    automatically. Note that Notifications API sandbox testing additionally
    requires an active Developer Edition subscription.
  deprecationPolicy: |
    Documented. Date-based versioning with an explicit breaking-change definition
    and a deprecation section in the REST API documentation.

findings:
- Reapit is the open end of the UK real-estate spectrum. Where the portals gate
  their contracts behind membership, the CRM vendor publishes a full public
  documentation site, an llms.txt index, markdown mirrors of every page, an
  open-source developer portal, and self-serve registration.
- The one artifact that would matter most to a machine — the Swagger document —
  is the single authenticated thing on an otherwise open surface. It returns
  HTTP 200 anonymously and then refuses to be a spec. Zero contracts harvested.
- Certification is not the axis here at all. There is no RESO, no OData, no UPI,
  and no MLS to certify against. Reapit's identifiers are explicitly per-tenant
  and not globally unique, which is the structural opposite of a UPI.
- The access gate splits cleanly in two, and conflating them would misrepresent
  the provider. Developer access is self-serve and same-day. Customer data access
  requires AppMarket review plus an individual agency's install and scope grant,
  revocable by uninstall.
- Reapit ships an alpha MCP server with a dedicated OAuth scope. That is a more
  advanced agent posture than anything else found in the UK real-estate leg, and
  it is layered on the same token infrastructure rather than bolted on.
- The lettings and property-management depth — tenancies, landlords, works
  orders, certificates, alarm data, key movements — is a genuine differentiator.
  Listing-portal APIs in this market have none of it.
- Absence is a finding - no OpenAPI or Swagger downloadable anonymously, no
  OData $metadata, no RESO, no UPI, no AsyncAPI, no Postman workspace, no
  payments API, no open data, and no developer link anywhere in the marketing
  site's sitemap.

