aid: reapit
name: Reapit
review:
  question: What is Reapit's real, publicly reachable API surface, what does a
    developer have to sign or join to use it, and what is its RESO posture?
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: crm-transaction-tech
  primaryDomain: reapit.com
  summary: |
    Reapit is the strongest developer surface found so far in this sector's UK
    leg, and it is the clean counter-example to "certified but unreachable".
    There is no certification here at all — RESO does not exist in the UK — but
    there is a real, documented, self-serve developer platform called Reapit
    Foundations. The documentation site at foundations-documentation.reapit.cloud
    is fully public with no login, publishes an llms.txt index, and serves a
    markdown version of every page by appending ".md". A four-step registration
    form at developers.reapit.cloud/register creates a developer account behind
    published Developer Terms and Conditions, and an SBOX sandbox with
    demonstration data is callable immediately for both read and write.
    Authentication is OpenID Connect through Reapit Connect, whose discovery
    document is served anonymously and was harvested verbatim. The platform
    covers roughly thirty CRM resource domains, a GraphQL proxy, a webhook system
    with more than sixty topics, an inbound Notifications API, a desktop URI-scheme
    API into the AgencyCloud CRM, and an alpha MCP server.

    The one thing that is NOT public is the contract. The Interactive API Explorer
    at developers.reapit.cloud/swagger is a Swagger UI React SPA that loads its
    document from platform.reapit.cloud/docs with an injected
    "Authorization: Bearer" header and an "api-version: 2020-01-31" header. That
    path answers HTTP 200 to an anonymous client but returns only
    {"errorType":"string","errorMessage":"Could not load Swagger documentation.
    Please try again later","trace":[]} — 111 bytes, no spec. Every other spec
    path probed on that host returned 401. So: zero machine-readable contracts
    harvested, despite an otherwise open developer surface. The second caveat is
    the data. Sandbox is self-serve, but no real agency's data is reachable until
    the app is submitted to the AppMarket, passes Reapit's listing review, and is
    then installed by that customer, who grants the scopes at install time and
    can revoke them by uninstalling.

resoPosture:
  certified: false
  posture: No RESO reference found anywhere in Reapit's documentation, developer
    portal, or corporate site; RESO is a North American (NAR/MLS) construct and
    the United Kingdom has no MLS to certify against.
  webApiCertification: none found
  dataDictionaryCertification: none found
  dataDictionaryVersion: null
  directoryEvidence: |
    https://www.reso.org/certificates/ was fetched anonymously (HTTP 200,
    416,233 bytes) and a case-insensitive search for "reapit" and for
    "united kingdom" returned zero matches. https://www.reso.org/certification/
    returned HTTP 200 with no Reapit reference. https://certification.reso.org/
    returned HTTP 400 to an anonymous client and
    https://www.reso.org/certified-organizations/ returned HTTP 404. No RESO
    certification claim appears on any Reapit property.
  odataEndpoint: none
  metadataDocument: |
    Probed https://platform.reapit.cloud/$metadata — HTTP 401, 26 bytes,
    {"message":"Unauthorized"}. No OData service document or $metadata exists;
    the platform is described by its own documentation as a hypermedia REST API
    with date-based versioning and a Swagger contract, not OData.
  universalPropertyIdentifier: |
    No UPI. Reapit's own documentation is explicit that its identifiers are the
    opposite of universal: "the resource identifiers are only unique to a
    specific customer's database and not globally unique. To determine
    uniqueness, create a composite key using the customer id and resource id."
    That is a per-tenant identifier space, structurally incompatible with a UPI.
  wordBoundaryGrep: |
    Case-insensitive word-boundary grep for RESO, "Data Dictionary",
    "Universal Property Identifier", UPI, IDX, VOW, MLS and OData across every
    harvested Foundations markdown page (api.md, api-documentation.md,
    webhooks.md, graphql.md, mcp-alpha.md, notifications.md, desktop-api.md,
    reapit-connect.md, developer-portal.md, permissions.md,
    developer-terms-and-conditions.md, app-listing-review.md) and llms.txt
    returned zero hits. A grep of https://www.reapit.com/ for "reso" matched
    only the substrings inside "resource"/"resolve"-family words.
  marketNote: |
    This is the expected and correct UK answer. There is no MLS, so there is no
    cooperative database to standardise and nothing to certify. Residential
    listings are controlled by two portals, Rightmove and Zoopla, and they are
    fed outward from agency CRM systems — Reapit, Alto/Jupix, Street, Apex27 —
    over proprietary per-vendor contracts. The interesting consequence is that
    the CRM vendor, not the portal and not a standards body, ends up owning the
    richest machine-readable property record in the market. Reapit's API is
    better documented and more open than either portal's, which inverts the US
    pattern where the standard is mandated and the endpoint is locked.

accessGate:
  gate: self-serve
  gated: true
  selfServe: true
  gateNuance: |
    Two gates, and they must not be collapsed. The DEVELOPER gate is self-serve:
    anyone can complete the registration form, accept the terms, confirm by
    email, and immediately call the sandbox. The DATA gate is
    application-approval plus customer consent: no live agency data is reachable
    until the app is submitted to the AppMarket, reviewed and approved by
    Reapit's admin team, and then installed by an individual customer who grants
    the scopes. Classified here as self-serve because a developer really can sign
    up unaided and make authenticated, writable API calls the same day — but the
    production surface is gated twice over.
  whatYouMustSignOrJoin: |
    You must accept the Reapit Developer Terms and Conditions, presented as a
    modal in the registration wizard and published in full at
    https://foundations-documentation.reapit.cloud/developer-terms-and-conditions
    (89,238 bytes of markdown, including consumption cost methodology and cost
    type schedules). You do not have to be a Reapit customer, an estate agent, a
    licensed broker, or a member of any association or board. There is no MLS,
    board, or IDX/VOW licence in this market. To list an app you must additionally
    complete Organisation details including company name, VAT/company registration
    or National Insurance number, and company address, and pass the AppMarket
    listing review.
  credentialIssuance: |
    Self-issued through the developer portal. Registration is a four-step form at
    https://developers.reapit.cloud/register which POSTs a CreateDeveloperModel
    with an agreedTerms timestamp; on success you confirm by email and log in
    through Reapit Connect. Registering an app in the portal yields a client id
    immediately, and a client secret as well if you selected the client
    credentials flow. No human issues keys, no GPG exchange, no sales call.
    Note that the getting-started guide is written for the invited path
    ("You will receive an email with a link to the developer portal and temporary
    login credentials"), which reads as invite-only, but the public /register
    route and its form component in the open-source developer-portal package
    confirm open self-registration.
  productionAccess: |
    Submit the app at https://marketplace.reapit.cloud/developer/submit-app.
    Reapit's admin team reviews the revision. Once listed, a customer
    administrator chooses to install it and grants the permissions (OAuth scopes)
    it requested. Client-credentials callers then pass that customer's unique id
    in a `reapit-customer` header. If the customer uninstalls, access to their
    data is revoked immediately.
  commercialContact: https://www.reapit.com/company/contact
  partnerProgram: https://www.reapit.com/company/partner-program
  docsAreOpen: |
    The documentation is genuinely open — no login, markdown mirrors of every
    page, and an llms.txt index built for machine consumption. The contract is
    not: the Swagger document itself is the single authenticated artifact in an
    otherwise public surface.

openData:
  publishesOpenData: false
  note: |
    Reapit publishes no open, unlicensed, publicly callable dataset. Everything
    behind Foundations is an individual agency customer's private CRM data,
    accessible only with that customer's installed consent. The genuinely open UK
    property layer sits in the public sector — HM Land Registry Price Paid Data
    and ownership data under the Open Government Licence, and Ordnance Survey
    open addressing and mapping products — and none of it is operated by Reapit.
    This is the inverse of the US arrangement: the UK has no industry standard,
    but it does have real open government property data, and it comes from
    government rather than from the private market.

authModel:
  scheme: OpenID Connect on top of OAuth 2.0, via Reapit Connect
  identityProvider: |
    Auth0. The anonymously served discovery document at
    https://connect.reapit.cloud/.well-known/openid-configuration (HTTP 200,
    2,669 bytes, harvested verbatim to
    authentication/reapit-connect-openid-configuration.json) lists Auth0-specific
    grant types such as http://auth0.com/oauth/grant-type/password-realm and
    http://auth0.com/oauth/grant-type/mfa-oob.
  issuer: https://connect.reapit.cloud/
  authorizationEndpoint: https://connect.reapit.cloud/authorize
  tokenEndpoint: https://connect.reapit.cloud/oauth/token
  documentedTokenEndpoint: |
    The REST API documentation instructs client-credentials callers to POST to
    https://connect.reapit.cloud/token, while the discovery document advertises
    https://connect.reapit.cloud/oauth/token. Both are recorded as found.
  jwksUri: https://connect.reapit.cloud/.well-known/jwks.json
  userinfoEndpoint: https://connect.reapit.cloud/userinfo
  registrationEndpoint: https://connect.reapit.cloud/oidc/register
  revocationEndpoint: https://connect.reapit.cloud/oauth/revoke
  deviceAuthorizationEndpoint: https://connect.reapit.cloud/oauth/device/code
  backchannelAuthenticationEndpoint: https://connect.reapit.cloud/bc-authorize
  grants:
  - name: authorization_code
    note: For client and server applications with a user in context. Required for
      the GraphQL service, which needs an idToken.
  - name: client_credentials
    note: For server-to-server machine applications with no user in context.
      HTTP Basic base64(client_id:client_secret) on the token request, and a
      `reapit-customer` header (or `SBOX`) on every platform call.
  pkce: S256 and plain both advertised
  tokenEndpointAuthMethods:
  - client_secret_basic
  - client_secret_post
  - private_key_jwt
  - none
  tokenType: Bearer, expires_in 3600
  oidcScopesAdvertised:
  - openid
  - profile
  - offline_access
  - name
  - given_name
  - family_name
  - nickname
  - email
  - email_verified
  - picture
  - created_at
  - identities
  - phone
  - address
  platformScopeModel: |
    Platform authorization is a separate, application-level permission model
    layered on top of the OIDC scopes above. Permissions are selected at app
    registration, granted per customer at install time, and map to CRM resource
    domains split into Read (ingest CRM information) and Write (push new or
    amended data into the CRM). The published permission list covers Applicants,
    Areas, Appointments, Certificates, Companies, Contacts, Conveyancing,
    Documents, Enquiries, Identity Checks, Invoices, Journal Entries, Keys,
    Landlords, Negotiators, Offers, Offices, Properties, Property Alarm Data,
    Referrals, Sources, Tasks, Telephony Notifications, Tenancies, Transactions,
    Vendors and Works Orders. Two concrete scope strings appear verbatim in the
    docs — `agencyCloud/mcp.access` (required for the MCP server; a token without
    it is rejected with 403) and `negotiators.read` (required to map users for
    the Notifications API).
  customerHeader: |
    `reapit-customer: <customer-id>` identifies the tenant a machine-to-machine
    request acts for. `SBOX` selects the sandbox. User-context tokens carry the
    customer code themselves.
  versionHeader: 'api-version: 2020-01-31 (required on every request)'

apiFamily:
  segmentationUsedByTheDocs:
  - MCP (Alpha)
  - REST API
  - Webhooks
  - GraphQL
  - Reapit Connect
  - Desktop API
  - Notifications
  note: |
    The seven entries in apis.yml mirror the seven entries Reapit itself lists on
    https://foundations-documentation.reapit.cloud/api exactly, in the same
    order-of-meaning. No family was invented and none was merged.
  listingsSearch: |
    Yes, but per-tenant. GET /properties on the platform API and
    `properties_search` on the MCP server search the installed customer's own
    property records, not a market-wide pool. There is no cross-agency search and
    no public listings endpoint.
  propertyRecords: |
    The richest surface. Properties carry descriptions, notes, marketing
    material, utilities, keys, certificates, developments, and images including
    EPCs, floorplans and maps. Sub-resources include appraisals, key movements and
    property alarm data.
  valuationAVM: |
    No AVM. The closest thing is the Appraisals sub-resource on properties and
    the appraisal lead concept — an agent's valuation appointment, not an
    automated valuation model. Reapit does not publish a valuation API.
  transactions: |
    Yes. Conveyancing (sales progression and chain management), Offers with
    accepted/rejected/withdrawn lifecycle, Invoices, and Transactions (lettings
    transactions and works orders) are all first-class resource domains.
  documents: |
    Yes. A Documents domain with typed file assets attached to entities, uploaded
    through pre-signed URLs.
  tenancy: |
    Yes, and it is a genuine strength relative to the rest of this sector.
    Tenancies, Landlords, Vendors, Works Orders, Certificates (safety checks,
    insurance and warranties) and Property Alarm Data cover the lettings and
    property-management side that most listing-oriented APIs omit entirely.
  payments: |
    No payments API in the Foundations documentation. Client Accounts (rent runs
    and landlord payments) is a Reapit product, delivered via a PayProp connector
    rather than a documented developer API. An internal
    payments-service.prod.paas.reapit.cloud host appears in the developer portal
    bundle but is not documented publicly.
  metadata: |
    A metadata service allows custom fields to be attached to Reapit entities and
    entirely custom entities to be created, validated against a schema, and
    searched. This is the platform's extensibility seam and is explicitly absent
    from the GraphQL proxy because arbitrary JSON cannot be strongly typed.

harvest:
  fetchDate: '2026-07-26'
  openapiHarvested: false
  specsCount: 0
  whyNoSpec: |
    The Swagger document exists but is not anonymously reachable. The
    open-source developer portal component
    packages/developer-portal/src/components/swagger/index.tsx uses
    swagger-ui-react with a requestInterceptor that injects
    `api-version: 2020-01-31` and `Authorization: Bearer <accessToken>` from the
    Reapit Connect session onto the swaggerUri fetch. The unauthenticated fetch
    of https://platform.reapit.cloud/docs returns HTTP 200 with a 111-byte error
    body rather than a spec, and every neighbouring spec path returns 401. The
    npm package @reapit/foundations-ts-definitions@2.1.23 — documented as
    generated "from the Swagger contracts direct with a daily CRON job" — was
    downloaded and its tarball contains only dist/index.js, index.mjs,
    index.d.ts, index.d.mts, package.json and README.md, with no bundled spec.
    A recursive tree search of github.com/reapit/foundations (6,939 paths) and
    github.com/reapit/foundations-documentation found no committed swagger or
    openapi document, only .yarn cache archives and screenshots.
  artifactsSaved:
  - path: authentication/reapit-connect-openid-configuration.json
    sourceURL: https://connect.reapit.cloud/.well-known/openid-configuration
    httpStatus: 200
    bytes: 2669
    format: OpenID Connect Discovery 1.0
    parsed: true
    note: Saved verbatim, unmodified. Fetched anonymously with no credentials.

